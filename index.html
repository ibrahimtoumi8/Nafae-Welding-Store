                                <button onClick={() => {setView('home'); setMobileMenuOpen(false)}} className="p-3 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-right">الرئيسية</button>
                                <button onClick={() => {setView('products'); setMobileMenuOpen(false)}} className="p-3 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-right">المنتجات</button>
                                <button onClick={() => {setView('ai-design'); setMobileMenuOpen(false)}} className="p-3 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-right text-purple-600">المصمم الذكي</button>
                                <button onClick={() => {setIsContactModalOpen(true); setMobileMenuOpen(false)}} className="p-3 bg-blue-50 text-primary rounded text-right">خدمة العملاء</button>
                            </div>
                        )}
                    </header>

                    <main className="flex-grow fade-in pb-10">
                        {view === 'home' && <><Hero onChangeView={setView} /><ProductList onProductClick={(p) => {setSelectedProduct(p); setView('product-detail')}} onAddToCart={handleAddToCart} /><WorkGallery /></>}
                        {view === 'products' && <ProductList onProductClick={(p) => {setSelectedProduct(p); setView('product-detail')}} onAddToCart={handleAddToCart} />}
                        {view === 'product-detail' && selectedProduct && <ProductDetail product={selectedProduct} onBack={() => setView('products')} onAddToCart={handleAddToCart} />}
                        {view === 'cart' && <Cart cart={cart} onUpdateQuantity={setItemQuantity} onRemoveItem={removeItem} onChangeView={setView} />}
                        {view === 'checkout' && <Checkout onChangeView={setView} cartTotal={cartTotalPrice} cart={cart} />}
                        {view === 'ai-design' && <AiDesignGenerator onUseDesign={() => setView('custom-design')} />}
                        {view === 'about' && <About onChangeView={setView} />}
                        
                        {view === 'custom-design' && (
                            <div className="max-w-3xl mx-auto px-4 py-12">
                                <h2 className="text-3xl font-bold mb-8 text-center text-gray-900 dark:text-white">اطلب تصميمك الخاص</h2>
                                <form action="https://formspree.io/f/mvgvgzbj" method="POST" className="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-xl space-y-6">
                                    <div><label className="block font-bold mb-2 dark:text-white">الاسم</label><input type="text" name="name" required className="w-full p-4 border rounded-xl dark:bg-gray-700 dark:text-white" /></div>
                                    <div><label className="block font-bold mb-2 dark:text-white">الهاتف</label><input type="tel" name="phone" required className="w-full p-4 border rounded-xl dark:bg-gray-700 dark:text-white" /></div>
                                    <div><label className="block font-bold mb-2 dark:text-white">التفاصيل</label><textarea name="details" required className="w-full p-4 border rounded-xl h-32 dark:bg-gray-700 dark:text-white"></textarea></div>
                                    <button type="submit" className="w-full bg-primary text-white py-4 rounded-xl font-bold hover:bg-primary-dark">إرسال الطلب</button>
                                </form>
                            </div>
                        )}

                        {view === 'success' && (
                            <div className="flex flex-col items-center justify-center py-20 text-center min-h-[60vh]">
                                <div className="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mb-6 text-5xl">✅</div>
                                <h2 className="text-3xl font-bold text-green-600 mb-4">تم استلام طلبك بنجاح!</h2>
                                <p className="text-xl text-gray-600 mb-8">سنتصل بك قريباً لتأكيد التفاصيل.</p>
                                <button onClick={() => setView('home')} className="bg-primary text-white px-10 py-4 rounded-xl font-bold">العودة للرئيسية</button>
                            </div>
                        )}

                        <CustomerServiceModal isOpen={isContactModalOpen} onClose={() => setIsContactModalOpen(false)} />
                        <div className="fixed bottom-6 right-6 z-30">
                            <button onClick={() => setIsContactModalOpen(true)} className="bg-primary text-white p-4 rounded-full shadow-lg hover:bg-primary-dark transition hover:scale-110 animate-bounce">
                                <HeadphonesIcon size={28} />
                            </button>
                        </div>
                    </main>

                    <footer className="bg-gray-900 text-gray-300 py-12 border-t border-gray-800">
                        <div className="max-w-7xl mx-auto px-4 text-center md:text-right grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div>
                                <h3 className="text-xl font-bold text-white mb-4 flex items-center justify-center md:justify-start"><Briefcase className="ml-2 text-primary"/> نافع للحدادة</h3>
                                <p className="text-sm">الجودة، الأمان، والتصميم العصري.</p>
                            </div>
                            <div>
                                <h3 className="text-xl font-bold text-white mb-4">تواصل معنا</h3>
                                <ul className="space-y-2">
                                    <li className="flex items-center justify-center md:justify-start"><Phone className="w-4 h-4 ml-2"/> 0776 08 40 97</li>
                                    <li className="flex items-center justify-center md:justify-start"><Mail className="w-4 h-4 ml-2"/> nafaetoumi20@gmail.com</li>
                                </ul>
                            </div>
                            <div className="flex justify-center md:justify-start items-center gap-4">
                                <a href="#" className="p-3 bg-gray-800 rounded-full hover:bg-blue-600 text-white"><Facebook /></a>
                                <a href="#" className="p-3 bg-gray-800 rounded-full hover:bg-red-600 text-white"><Mail /></a>
                            </div>
                        </div>
                        <div className="text-center mt-8 pt-8 border-t border-gray-800 text-sm text-gray-500">&copy; 2025 ورشة نافع للحدادة الفنية.</div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
